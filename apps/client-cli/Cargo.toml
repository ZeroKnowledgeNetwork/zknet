[package]
name = "zknet-client-cli"
version = "0.0.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "zknet"
path = "src/main.rs"


[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["io-util", "macros", "process", "rt-multi-thread"] }
zknet-client-core = { path = "../../libs/client-core" }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
