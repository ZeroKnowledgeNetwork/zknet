# The mixnet end-to-end check: builds the opt services and WalletShield,
# starts the local Katzenpost test network (packages/opt/docker, the `mixnet`
# Nx project) and sends traffic through it with WalletShield. It guards the
# clients <-> mixnet <-> services circuit on main; it does not test the clients
# or anon-rpc. It runs when a change touches packages/opt/ (or this file); on
# any other change the job is skipped, which a required check accepts.
name: mixnet-e2e

on:
  push:
    branches: [main]
  pull_request:
  # daily on main: the RPC matrix's view of the public testnet endpoints
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      opt: ${{ steps.diff.outputs.opt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # a new branch, a force push, a schedule or a manual run has no usable base: run
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo opt=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE...$GITHUB_SHA" -- packages/opt .github/workflows/mixnet-e2e.yml | grep -q .; then
            echo opt=true >> "$GITHUB_OUTPUT"
          else
            echo opt=false >> "$GITHUB_OUTPUT"
          fi

  mixnet-e2e:
    needs: changes
    if: needs.changes.outputs.opt == 'true'
    # pinned: on ubuntu-26.04 (ubuntu-latest from 2026-11) the network's
    # container builds ran past the job's timeout
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
      NX_TUI: "false"
      # the runner's docker (the Makefile would prefer podman, which it also has)
      docker: docker
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the Go module and build caches of the network's container builds live
      # in the katzenpost clone, so clone it before restoring them
      - run: make -C packages/opt/docker clone-katzenpost
      - id: mixnet-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/katzenpost.opt/docker/cache
          key: mixnet-go-${{ hashFiles('packages/opt/go.sum') }}
          restore-keys: mixnet-go-
      - run: pnpm exec nx run mixnet:start
      # saved once the builds are done rather than at the end of a successful
      # job, so a run that fails or times out later still leaves a warm cache
      - if: always() && steps.mixnet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/katzenpost.opt/docker/cache
          key: ${{ steps.mixnet-cache.outputs.cache-primary-key }}
      - run: pnpm exec nx run mixnet:ready
      - run: pnpm exec nx run mixnet:probe
      - run: pnpm exec nx run mixnet:serve
      # the RPC paths of services.json, through the network to public testnet
      # RPC endpoints: reported, not gating, since those endpoints are outside
      # this repository's control
      - name: mixnet:e2e-rpc (not gating)
        continue-on-error: true
        run: pnpm exec nx run mixnet:e2e-rpc
      - name: mixnet:stop
        if: always()
        run: pnpm exec nx run mixnet:stop
