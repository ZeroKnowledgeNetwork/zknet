# Distribution builds of the committed HEAD, on the Woodpecker docker backend.
# One definition serves both rungs: a tag event selects each Nx `dist` target's
# `release` configuration (see `rung` in lib.sh) and enables the release-only
# steps; any other event builds `dev`. A tag is one component's release
# (<id>@<semver>): `stamp` writes its version and `only` skips the other
# components' steps. ZKNET_DIST_PLATFORMS selects the OSes (run). Outputs land
# in dist/woodpecker/. See .woodpecker/README.md.

when:
  - event: [push, manual, tag]

steps:
  prepare:
    image: ghcr.io/rust-cross/cargo-zigbuild:0.23.4
    commands:
      - . "$CI_WORKSPACE/.woodpecker/lib.sh"
      # the image's rustup proxies (stamp updates Cargo.lock)
      - export PATH=/usr/local/cargo/bin:$PATH
      - tools node
      - checkout
      - pnpm_install
      - stamp

  walletshield:
    image: ghcr.io/goreleaser/goreleaser-cross:v1.27.3
    depends_on: [prepare]
    commands:
      - . "$CI_WORKSPACE/.woodpecker/lib.sh"
      - tools node zig upx
      - only walletshield
      - cd "$SRC"
      - pnpm exec nx run walletshield:dist:$(rung)

  cli:
    image: ghcr.io/rust-cross/cargo-zigbuild:0.23.4
    depends_on: [prepare]
    commands:
      - . "$CI_WORKSPACE/.woodpecker/lib.sh"
      # the image's rustup proxies, with RUSTUP_HOME in the cache directory
      - export PATH=/usr/local/cargo/bin:$PATH
      - tools node upx
      - only zknet_client_cli
      - cd "$SRC"
      - pnpm exec nx run zknet_client_cli:dist:$(rung)

  # The desktop is two steps of one definition, split by event: only the tag
  # (release) build maps the updater signing key, so a dev run needs no secret.
  # A step that depends on the desktop is split the same way (`collect`),
  # since Woodpecker refuses a dependency on a step `when` filters out.
  desktop:
    # The oldest supported LTS: the bundles need the glibc and WebKitGTK they
    # were built against, so build on old systems to run on newer ones.
    image: ubuntu:22.04
    depends_on: [prepare]
    when:
      - event: [push, manual]
    commands: &desktop
      - . "$CI_WORKSPACE/.woodpecker/lib.sh"
      - apt_install ca-certificates curl git xz-utils build-essential pkg-config file libwebkit2gtk-4.1-dev
      - tools node rust
      - only @zknet/client
      - own_target_dir
      - cd "$SRC"
      # a release: the version, and the updater's key and endpoint (release.mjs)
      - '[ "$(rung)" = dev ] || export TAURI_CONFIG="$(node release/release.mjs tauri-config)"'
      - pnpm exec nx run @zknet/client:desktop-build:$(rung)

  desktop-release:
    image: ubuntu:22.04
    depends_on: [prepare]
    when:
      - event: tag
    environment:
      # the release rung signs the updater artifacts; without these secrets
      # woodpecker-cli refuses the run before any step starts
      TAURI_SIGNING_PRIVATE_KEY:
        from_secret: tauri_signing_private_key
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        from_secret: tauri_signing_private_key_password
    commands: *desktop

  # --- release rung only: stubs until signing and publishing are decided ----

  sign:
    image: alpine:latest
    depends_on: [walletshield, cli, desktop-release]
    when:
      - event: tag
    commands:
      - 'echo "sign: not configured yet (macOS notarization, Windows code signing)"'

  publish:
    image: alpine:latest
    depends_on: [sign]
    when:
      - event: tag
    commands:
      - 'echo "publish: not configured yet (release repository and notes)"'

  # --- always: hand the outputs to the host user -----------------------------

  collect:
    image: alpine:latest
    depends_on: [walletshield, cli, desktop]
    when:
      - event: [push, manual]
        status: [success, failure]
    commands: &collect
      - out=$CI_WORKSPACE/dist/woodpecker
      - rm -rf "$out" && mkdir -p "$out"
      - cd /cache/src/dist
      - for d in walletshield zknet_client_cli; do [ ! -d $d ] || cp -a $d "$out/"; done
      - for p in target*/*/bundle/*/*.deb target*/*/bundle/*/*.rpm target*/*/bundle/*/*.AppImage; do [ ! -f $p ] || { mkdir -p "$out/zkn-client" && cp -a $p "$out/zkn-client/"; }; done
      - owner=$(stat -c %u:%g "$CI_WORKSPACE")
      - chown "$owner" "$CI_WORKSPACE/dist" && chown -R "$owner" "$out"
      - ls -R "$out" | head -60

  collect-release:
    image: alpine:latest
    depends_on: [walletshield, cli, desktop-release]
    when:
      - event: tag
        status: [success, failure]
    commands: *collect
