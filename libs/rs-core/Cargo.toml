[package]
name = "zknet_core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
directories-next = "2.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["time", "macros", "rt-multi-thread"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
