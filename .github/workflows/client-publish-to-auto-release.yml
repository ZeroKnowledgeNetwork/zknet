steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      fetch-tags: true

  - name: Install pnpm (no install)
    uses: pnpm/action-setup@v4
    with:
      run_install: false

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: lts/*
      cache: 'pnpm'

  - name: Extract VERSION from tag
    if: startsWith(github.ref, 'refs/tags/')
    shell: bash
    run: |
      echo "GITHUB_REF=${GITHUB_REF}"
      # Strip the prefix "client@" from the tag name (guarded to tag runs only)
      TAG_NAME="${GITHUB_REF#refs/tags/}"
      VERSION="${TAG_NAME#client@}"
      if [ -z "$VERSION" ]; then
        echo "VERSION empty after parsing tag $GITHUB_REF" >&2
        exit 1
      fi
      echo "VERSION=$VERSION" >> $GITHUB_ENV
      echo "Parsed VERSION=$VERSION"

  - name: Print debug info
    run: |
      echo "runner.os=$RUNNER_OS"
      echo "platform=${{ matrix.platform }}"
      echo "VERSION=${{ env.VERSION || 'unset' }}"
      git --no-pager show --no-patch --format='%h %an %s' HEAD

  - name: Install frontend deps
    run: pnpm install --frozen-lockfile

  - name: Generate changelog (tagged releases only)
    id: changelog
    if: startsWith(github.ref, 'refs/tags/')
    shell: bash
    run: |
      set -euo pipefail
      git fetch --no-tags origin HEAD || true
      {
        echo 'changelog<<EOF'
        git-cliff --latest --strip all --use-branch-tags --tag-pattern 'client@*' --include-path "apps/client/**/*" | sed -E \
          -e 's/^-[[:space:]]*\*\(client\)\*[[:space:]]*/- /' \
          -e 's/^-[[:space:]]*\*\(client\//- *(/'
        echo 'EOF'
      } >> $GITHUB_OUTPUT

  - name: Install Rust toolchain
    uses: dtolnay/rust-toolchain@stable
    with:
      # always install default stable; targets added per-platform below
      override: true

  - name: Add macOS targets (macOS only)
    if: matrix.platform == 'macos-latest'
    shell: bash
    run: |
      rustup target add aarch64-apple-darwin x86_64-apple-darwin || true

  - name: Rust cache
    uses: swatinem/rust-cache@v2
    with:
      # ensure key is unique per platform and lockfile
      workspaces: ./apps/client/src-tauri -> target
      key: ${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  # Build + release for macOS: build both archs in one job so we don't depend on runner CPU
  - name: Build and publish macOS (both archs)
    if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    shell: bash
    run: |
      set -euo pipefail
      cd apps/client
      # ensure tauri action can find project path; run action-like builds for each mac arch.
      # First attempt: run tauri-action twice to create/update the same release with artifacts for both archs.
      cd $GITHUB_WORKSPACE
  - name: Tauri publish (mac aarch64)
    if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
    uses: tauri-apps/tauri-action@v0
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      projectPath: ./apps/client
      tagName: client@${{ env.VERSION }}
      releaseName: client@${{ env.VERSION }}
      releaseBody: '${{ steps.changelog.outputs.changelog || "" }}'
      releaseDraft: true
      prerelease: true
      args: --target aarch64-apple-darwin

  - name: Tauri publish (mac x86_64)
    if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
    uses: tauri-apps/tauri-action@v0
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      projectPath: ./apps/client
      tagName: client@${{ env.VERSION }}
      releaseName: client@${{ env.VERSION }}
      releaseBody: '${{ steps.changelog.outputs.changelog || "" }}'
      releaseDraft: true
      prerelease: true
      args: --target x86_64-apple-darwin

  # Linux / Windows builds: single publish (tagged runs only)
  - name: Tauri publish (linux)
    if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'ubuntu-22.04'
    uses: tauri-apps/tauri-action@v0
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      projectPath: ./apps/client
      tagName: client@${{ env.VERSION }}
      releaseName: client@${{ env.VERSION }}
      releaseBody: '${{ steps.changelog.outputs.changelog || "" }}'
      releaseDraft: true
      prerelease: true

  - name: Tauri publish (windows)
    if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
    uses: tauri-apps/tauri-action@v0
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      projectPath: ./apps/client
      tagName: client@${{ env.VERSION }}
      releaseName: client@${{ env.VERSION }}
      releaseBody: '${{ steps.changelog.outputs.changelog || "" }}'
      releaseDraft: true
      prerelease: true