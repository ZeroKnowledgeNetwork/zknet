# The checks: .woodpecker/ci.yaml (format, lint, test, build, typecheck) on the
# Woodpecker docker backend, the same pipeline `.woodpecker/run ci` runs
# locally. This workflow only supplies the runner and the format check's base.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      # a full clone: the pipeline's checkout fetches from it, which a partial
      # (filter) clone cannot serve
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # NX_BASE: the last commit on main whose CI succeeded (on a PR, the merge base)
      - uses: nrwl/nx-set-shas@v5

      - uses: ./.github/actions/woodpecker-cli

      - run: .woodpecker/run ci --pipeline-event "$GITHUB_EVENT_NAME" --prev-commit-sha "$NX_BASE"
        env:
          ZKNET_WOODPECKER_CACHE: ${{ runner.temp }}/woodpecker-cache
